# Non-secret settings. Secrets go in .env.
app:
  display_timezone: Asia/Kolkata
  default_market: US
cache:
  lru_entries: 5000
  quote_ttl_s: 5
  intraday_ttl_s: 60
  daily_ttl_s: 3600
  search_ttl_s: 86400
  news_ttl_s: 120
  movers_ttl_s: 60
  crypto_ttl_s: 60
  # Phase 6: SEC company facts, filings list, insider trades, Yahoo holders
  facts_ttl_s: 21600
  filings_ttl_s: 900
  insiders_ttl_s: 3600
  holders_ttl_s: 21600
  # Phase 7
  fred_ttl_s: 3600
  fred_search_ttl_s: 86400
  rates_ttl_s: 1800
  earnings_ttl_s: 900
  eco_ttl_s: 21600

  # --- Phase 9 ---
  screener_ttl_s: 900
  peers_ttl_s: 86400
providers:
  # Empty on purpose: the default order of every capability lives in ONE table, backend/openterm/providers/hierarchy.py
  # (DEFAULT_ORDER; quotes and history are the ranked HIERARCHY with the reasons). Add an entry here only to override a
  # capability by hand, as a list of provider names, best first. A pin wins over the table and hides every source added to it
  # later; for quotes and history the log says so. Example:
  # news_top: [rss, marketaux]
  # Stooq is retired (bot check), see docs/DATA_LIMITS.md.
news:
  # Market top-stories feeds for N. Leave unset to use the built-in list
  # (CNBC, MarketWatch, BBC Business, Economic Times markets, Mint markets). Example:
  # feeds:
  #   - {name: CNBC, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"}
# --- Phase 7: macro ---
macro:
  # MACRO's keyless list. Leave unset for the built-in list (providers/macro.py CURATED). Example:
  # curated: [GDP, CPIAUCSL, UNRATE, FEDFUNDS, DGS10, DGS2, T10Y2Y]
# --- Phase 11: LLM gateway ---
llm:
  # US$ per million tokens, used for OpenAI and Anthropic direct (OpenRouter reports its own cost; Ollama is free).
  # A model with no price here is refused while a daily spend cap is set (PRICE UNKNOWN). Copy prices from the
  # provider's pricing page; none are filled in so nothing here goes stale silently. Example shape:
  # prices:
  #   openai:    {"<model id>": {input: 0.0, output: 0.0}}
  #   anthropic: {"<model id>": {input: 0.0, output: 0.0}}
  #   deepseek, groq, mistral, xai, together, fireworks, gemini: same shape (all priced here, like openai)
  #   opencodego is a flat subscription: priced 0 per call unless you set a price here (llm/client.py FLAT_FEE)
  # ollama_url: http://127.0.0.1:11434
