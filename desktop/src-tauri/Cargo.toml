[package]
name = "openterm-desktop"
version = "0.1.0"
description = "OpenTerm desktop shell: a window around the local OpenTerm backend"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
