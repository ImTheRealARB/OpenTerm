[project]
name = "openterm-sdk"
version = "0.1.0"
description = "Python client for a running OpenTerm: quotes, bars, fundamentals, news, screens, macro, options and backtests as pandas DataFrames that keep their source and as-of time"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openterm_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # tests run against the source tree, installed or not

[tool.ruff]
line-length = 110
