[project]
name = "openterm"
version = "0.0.1"
description = "OpenTerm backend: keyboard-first market terminal API"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx[http2]>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "aiosqlite>=0.20",
  "msgpack>=1.0",
  "apscheduler>=3.10,<4",
  # uvloop has no Windows build; asyncio's default loop is used there.
  "uvloop>=0.19; sys_platform != 'win32'",
  "numpy>=1.26",
  "pandas>=2.2,<3",
  # Phase 15 `openterm.quantlib`: imported in job workers and tests only, never in the server process.
  "scipy>=1.13",
  "statsmodels>=0.14",
  "arch>=7.0",
  "psutil>=5.9",
  "keyring>=25",
  "pypdf>=6.21.1",
]

# `uv run openterm-mcp` = the stdio bridge for MCP clients (Claude Desktop, Claude Code). Same program as `python -m openterm.mcp`.
[project.scripts]
openterm-mcp = "openterm.mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openterm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n 10 --dist worksteal"  # pytest-xdist; 10 measured 67 s vs 81 s for 6 on an idle 20-thread machine, both green (docs/PERFORMANCE.md). Debug serially with -n 0.

[tool.ruff]
line-length = 100
