[project]
name = "openterm"
version = "0.0.1"
description = "OpenTerm backend: keyboard-first market terminal API"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx[http2]>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "aiosqlite>=0.20",
  "msgpack>=1.0",
  "apscheduler>=3.10,<4",
  # uvloop has no Windows build; asyncio's default loop is used there.
  "uvloop>=0.19; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openterm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
